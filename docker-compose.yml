services:
  coturn:
    image: coturn/coturn:latest
    container_name: webrtc-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

  signaling:
    build:
      context: ./backend
    container_name: webrtc-signaling
    restart: unless-stopped
    ports:
      - "8721:8721"
    environment:
      WEBRTC_ICESERVERS_0_URLS: stun:${TURN_HOST:-localhost}:3478
      WEBRTC_ICESERVERS_1_URLS: turn:${TURN_HOST:-localhost}:3478
      WEBRTC_ICESERVERS_1_USERNAME: ${TURN_USERNAME:-webrtc}
      WEBRTC_ICESERVERS_1_CREDENTIAL: ${TURN_CREDENTIAL:-changeme}
    depends_on:
      - coturn

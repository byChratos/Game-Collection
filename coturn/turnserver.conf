listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200

fingerprint
lt-cred-mech

user=webrtc:changeme
realm=game-collection.local

# Set this to the machine's public/reachable IP so ICE candidates are usable
# from outside the Docker host, e.g. external-ip=203.0.113.10
external-ip=cooler-test.duckdns.org

no-multicast-peers
no-cli

# Without this coturn writes to /var/log/turn_*.log inside the container, so
# "docker logs" stays empty and allocation/permission failures are invisible.
log-file=stdout
verbose
